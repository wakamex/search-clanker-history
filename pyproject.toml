[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "search-clanker-history"
version = "0.3.0"
description = "Search across Claude Code, Codex, OpenCode, Hermes, Antigravity, Gemini CLI, Zcode, Grok Build, Devin CLI, DeepSeek Harness, Cursor and Muse Code session history"
readme = "README.md"
keywords = ["claude-code", "codex", "opencode", "hermes", "antigravity", "gemini-cli", "zcode", "grok", "devin", "deepseek-harness", "cursor", "muse", "session-history", "search", "ai-agents", "cli"]
requires-python = ">=3.10"
license = "MIT"

[project.urls]
Homepage = "https://github.com/wakamex/search-clanker-history"
Source = "https://github.com/wakamex/search-clanker-history"

[project.optional-dependencies]
hyperscan = ["hyperscan>=0.7"]
ripgrep = ["ripgrep>=15"]

[project.scripts]
search-clanker-history = "_search_clanker_history_entry:main"

[tool.hatch.build.targets.wheel.force-include]
"src/_search_clanker_history_entry.py" = "_search_clanker_history_entry.py"
